# Деплой Meta edge functions (включая Facebook OAuth).
# Секреты GitHub: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (= rgttklitvvqsnlsakvzr для romi-agency)
name: Deploy Meta edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/meta-list-ad-accounts/**"
      - "supabase/functions/meta-daily-sync/**"
      - "supabase/functions/meta-validate-cabinet/**"
      - "supabase/functions/meta-connect-token/**"
      - "supabase/functions/meta-oauth-start/**"
      - "supabase/functions/meta-oauth-callback/**"
      - "supabase/functions/ads-telegram-webhook/**"
      - "supabase/functions/_lib/meta_list_ad_accounts.ts"
      - "supabase/functions/_lib/meta_connect_helpers.ts"
      - "supabase/functions/_lib/cabinet_meta_resolve.ts"
      - "supabase/functions/_lib/auth.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-meta-edge-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-meta-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'rgttklitvvqsnlsakvzr' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets
        run: |
          set -e
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "::error::SUPABASE_PROJECT_REF missing"; exit 1)

      - name: Deploy Meta + OAuth edge functions
        run: |
          set -e
          for fn in meta-list-ad-accounts meta-daily-sync meta-validate-cabinet meta-connect-token meta-oauth-start; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
          echo "::group::Deploy meta-oauth-callback (no JWT)"
          supabase functions deploy meta-oauth-callback --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          echo "::endgroup::"
          echo "::group::Deploy ads-telegram-webhook (no JWT)"
          supabase functions deploy ads-telegram-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          echo "::endgroup::"
          echo "::group::Deploy ads-telegram-bot-save"
          supabase functions deploy ads-telegram-bot-save --project-ref "$SUPABASE_PROJECT_REF"
          echo "::endgroup::"
          echo "::group::Deploy ads-telegram-bot-test"
          supabase functions deploy ads-telegram-bot-test --project-ref "$SUPABASE_PROJECT_REF"
          echo "::endgroup::"
