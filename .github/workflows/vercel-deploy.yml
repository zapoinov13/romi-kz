# Production deploy → https://romi-kz.vercel.app
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Vercel Production Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
      - ".github/workflows/deploy-meta-edge-functions.yml"
      - ".github/workflows/content-factory-cleanup.yml"
      - "docs/**"
      - "*.md"
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Vercel secrets
        run: |
          set -e
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "::error::VERCEL_TOKEN missing"; exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "::error::VERCEL_ORG_ID missing"; exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "::error::VERCEL_PROJECT_ID missing"; exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --yes --no-wait --token="${{ secrets.VERCEL_TOKEN }}"
